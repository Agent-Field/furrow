name: release

# Publishes native binaries for Linux, macOS and Windows.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: "0.13.0"
  CARGO_ZIGBUILD_VERSION: "0.24.0"

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    env:
      BINARY_SUFFIX: ${{ startsWith(matrix.os, 'windows-') && '.exe' || '' }}
      BUILD_ROOT: ${{ startsWith(matrix.os, 'ubuntu-') && 'target/zig' || 'target' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: furrow-linux-amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            native: true
          # arm64 Linux is not a niche here: DGX Spark and Jetson, Graviton,
          # Ampere, and Raspberry Pi all land on this target, and every one of
          # them has to install a Rust toolchain and build from source today.
          # Native on a hosted arm64 runner, so it gets the same smoke test as
          # the other native targets instead of shipping unverified.
          - asset: furrow-linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            native: true
          - asset: furrow-darwin-arm64
            target: aarch64-apple-darwin
            os: macos-14
            native: true
          # Cross-compiled on the arm64 runner; Apple's toolchain ships both
          # slices, so this needs no extra SDK. It cannot be smoke-tested here.
          - asset: furrow-darwin-amd64
            target: x86_64-apple-darwin
            os: macos-14
            native: false
          - asset: furrow-windows-amd64.exe
            target: x86_64-pc-windows-msvc
            os: windows-latest
            native: true
          - asset: furrow-windows-arm64.exe
            target: aarch64-pc-windows-msvc
            os: windows-latest
            native: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      - name: Cache Linux release tools
        if: runner.os == 'Linux'
        id: linux-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/furrow-release-tools/zig-${{ env.ZIG_VERSION }}
            ~/.local/share/furrow-release-tools/cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}
          key: linux-release-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ env.CARGO_ZIGBUILD_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install pinned Linux release tools
        if: runner.os == 'Linux' && steps.linux-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Use Zig's bundled glibc headers/libraries, never the runner's libc.
          case "${{ runner.arch }}" in
            X64)
              zig_arch=x86_64
              zig_sha256=d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
              ;;
            ARM64)
              zig_arch=aarch64
              zig_sha256=041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556
              ;;
            *) exit 1 ;;
          esac
          tools_dir="$HOME/.local/share/furrow-release-tools"
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-${zig_arch}-${ZIG_VERSION}.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$zig_sha256" "$archive" | sha256sum --check
          mkdir -p "$tools_dir/zig-${ZIG_VERSION}"
          tar -xJf "$archive" --strip-components=1 -C "$tools_dir/zig-${ZIG_VERSION}"
          cargo install --locked --version "$CARGO_ZIGBUILD_VERSION" cargo-zigbuild \
            --root "$tools_dir/cargo-zigbuild-${CARGO_ZIGBUILD_VERSION}" -j 2

      - name: Configure Linux release tools
        if: runner.os == 'Linux'
        run: |
          echo "$HOME/.local/share/furrow-release-tools/zig-${ZIG_VERSION}" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/furrow-release-tools/cargo-zigbuild-${CARGO_ZIGBUILD_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build Linux (glibc 2.17)
        if: runner.os == 'Linux'
        # The suffix selects glibc; Cargo's output directory uses the bare triple.
        run: cargo zigbuild --release --locked -p furrow-cli --bin furrow --target ${{ matrix.target }}.2.17 --target-dir target/zig -j 2

      - name: Build
        if: runner.os != 'Linux'
        # Include the Windows C runtime so a fresh machine needs no runtime installer.
        run: cargo build --release --locked -p furrow-cli --bin furrow --target ${{ matrix.target }} -j 4

      - name: Check Linux glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          max_glibc=$(objdump -T "$BUILD_ROOT/${{ matrix.target }}/release/furrow$BINARY_SUFFIX" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "${{ matrix.asset }}: $max_glibc (maximum allowed: GLIBC_2.17)"
          test "$(printf '%s\n' GLIBC_2.17 "$max_glibc" | sort -V | tail -1)" = GLIBC_2.17

      - name: Smoke test
        shell: bash
        if: matrix.native
        run: ./$BUILD_ROOT/${{ matrix.target }}/release/furrow$BINARY_SUFFIX --version

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          install -m 755 "$BUILD_ROOT/${{ matrix.target }}/release/furrow$BINARY_SUFFIX" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum furrow-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "furrow $TAG" \
              --generate-notes \
              --verify-tag
          fi
